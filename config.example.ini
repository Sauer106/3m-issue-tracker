; Copy this file to config.ini and edit the values for your server.
; config.ini holds credentials -- do not commit it to source control.

[database]
server = localhost
database = IssueTracker
driver = ODBC Driver 18 for SQL Server
; trusted_connection = yes uses Windows authentication (recommended on the box itself).
; Set to no and fill in username/password to use a SQL login instead.
trusted_connection = yes
username =
password =

[smtp]
; Your internal SMTP relay. Port 25 with no auth is typical for internal relays.
host = your-relay-hostname
port = 25
use_tls = no
username =
password =
from_address = 3m-issue-tracker@yourdomain.com

[app]
; URL your team uses to reach the app -- included in emails as a link.
app_url = http://yourserver:8501
timezone = America/New_York

[digest]
; The digest goes to every active user. Add extra addresses here (comma-separated)
; for managers or distribution lists that should also receive it.
extra_recipients =
